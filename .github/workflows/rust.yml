# Copied from https://github.com/rerun-io/rerun_template
on:
  push:
    branches:
      - "main"
  pull_request:
    types: [ opened, synchronize ]

name: Rust

env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.85.0
          override: true
          target: thumbv7em-none-eabihf
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --all-features

      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: -p eon_core --no-default-features

      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: -p eon_core --no-default-features --target thumbv7em-none-eabihf

  check_wasm:
    name: Check wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0
          override: true
          target: wasm32-unknown-unknown
          components: clippy,rustfmt

      - name: Check wasm32
        uses: actions-rs/cargo@v1
        with:
          command: check
          args: --target wasm32-unknown-unknown --lib

      - name: Check eon_core wasm32
        uses: actions-rs/cargo@v1
        with:
          command: check
          args: -p eon_core --target wasm32-unknown-unknown

      - name: Check eonfmt library-only wasm32
        uses: actions-rs/cargo@v1
        with:
          command: check
          args: -p eonfmt --no-default-features --target wasm32-unknown-unknown

      - name: Clippy wasm32
        env:
          CLIPPY_CONF_DIR: "scripts/clippy_wasm"
        run: cargo clippy --target wasm32-unknown-unknown --lib -- -D warnings

  formatter_core_wasm_size:
    name: Formatter Core Wasm Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0
          override: true
          target: wasm32-unknown-unknown

      - name: Check formatter-core wasm size budget
        run: ./scripts/measure_formatter_core_wasm_size.sh --check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.85.0
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --workspace

  fuzz_smoke:
    name: Fuzz Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.85.0
          override: true
      - name: Run fuzz smoke lane
        run: ./scripts/run_fuzz_smoke.sh

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.85.0
          override: true
          components: rustfmt
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.85.0
          override: true
          components: clippy
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: -- -D warnings

  # ---------------------------------------------------------------------------

  cargo-deny:
    name: Check Rust dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: EmbarkStudios/cargo-deny-action@v2
      with:
        rust-version: "1.85.0"
        log-level: warn
        command: check
